name: Release Drafter

on:
  push:
    # 当推送到 main 分支时自动更新 Release 草稿
    branches:
      - main
  # 触发 PR 关联，用于自动打标签
  pull_request_target:
    types: [opened, reopened, synchronized]

permissions:
  contents: write
  pull-requests: write

jobs:
  update_release_draft:
    permissions:
      contents: write  # 需要写权限以创建/更新 Release
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
