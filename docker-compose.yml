services:
  penshot:
    build:
      context: .
      dockerfile: Dockerfile
    image: story-shot-agent:latest
    container_name: story-shot-agent
    restart: unless-stopped
    ports:
      - "8000:8000"
    
    # 自动加载 penshot 所需的 LLM / Embedding 环境变量
    env_file:
      - .env
    environment:
      PENSHOT_API__HOST: "0.0.0.0"
      PENSHOT_API__PORT: "8000"

    # 健康检查联动
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # 容器资源上限控制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 512M

    # 日志防暴增配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"