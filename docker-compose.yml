services:
  # ===================================================
  # 1. 核心应用服务：story-shot-agent
  # ===================================================
  story-shot-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: penshot:latest
    container_name: penshot
    restart: unless-stopped
    ports:
      - "8000:8000"

    # 自动加载根目录下的 .env 文件（内含 LLM/Embedding API_KEY）
    env_file:
      - .env

    # 容器内特定覆盖环境变量
    environment:
      # 覆盖 API 监听地址，确保容器外部能正常访问端口
      PENSHOT_API__HOST: "0.0.0.0"
      PENSHOT_API__PORT: "8000"
      # 连接容器网络内部的 redis 服务（使用服务名 redis，密码需与下方 redis 配置匹配）
      PENSHOT_REDIS_HOST: "redis"
      PENSHOT_REDIS_PORT: 6379
      PENSHOT_REDIS_DB: 0
      PENSHOT_REDIS_PASSWORD: "123456"

    # 等待 Redis 健康就绪后再启动主应用
    depends_on:
      redis:
        condition: service_healthy

    # 健康检查联动
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # 资源控制
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          memory: 512M

    # 日志切分防塞满
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ===================================================
  # 2. 依赖服务：Redis 单节点
  # ===================================================
  redis:
    image: redis:7-alpine
    container_name: penshot-redis
    restart: unless-stopped
    # 如果需要在宿主机上直连调试 Redis，可取消下两行注释：
    # ports:
    #   - "6379:6379"

    # 启动 Redis 并设置连接密码（请将 123456 替换为实际密码）
    command: redis-server --requirepass 123456 --appendonly yes

    # 持久化 Redis 数据
    volumes:
      - redis_data:/data

    # Redis 健康检查
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a 123456 ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data: